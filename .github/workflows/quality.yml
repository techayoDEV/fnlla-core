name: FNLLA Core Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR validation is cancellable. Main, tags and manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Build and verify deterministic stable package
        shell: python
        run: |
          import pathlib, subprocess
          version = pathlib.Path('VERSION').read_text().strip()
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for folder in ['dist/release/fnlla-core-' + version, 'dist/repeat/fnlla-core-' + version]:
              subprocess.run(['php', 'scripts/build-local-artifact.php', version, folder, '--expected-commit=' + commit], check=True)
          archive = 'dist/release/fnlla-core-' + version + '.zip'
          assert pathlib.Path(archive).read_bytes() == pathlib.Path('dist/repeat/fnlla-core-' + version + '.zip').read_bytes()
          subprocess.run(['python', 'scripts/verify-release.py', archive, commit], check=True)
      - name: Test fail-closed exact-commit release checks
        if: runner.os == 'Linux'
        run: python -B -m unittest discover -s tests -p test_release_ci.py
      - uses: actions/upload-artifact@v7
        with:
          name: stable-package-${{ matrix.os }}
          path: dist/release/*.zip*
          if-no-files-found: error
          retention-days: 14

  quality:
    timeout-minutes: 10
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php:
          - "8.3"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify pinned brand assets
        run: python3 scripts/brand-consumer.py check

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, fileinfo, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Locate Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install analysis dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run smoke tests
        env:
          FNLLA_REQUIRE_SYMLINK_TESTS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: php scripts/test.php

      - name: Lint PHP
        run: php scripts/lint.php

      - name: Verify HTTP mail security
        run: python scripts/test-mail-http.py

      - name: Verify coding task evaluator
        run: python scripts/agent-eval.py self-test

      - name: Analyze types
        run: composer analyse

  services:
    timeout-minutes: 15
    name: MySQL and Redis PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: fnlla_core_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      FNLLA_CORE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=fnlla_core_test;charset=utf8mb4
      FNLLA_CORE_TEST_MYSQL_USER: root
      FNLLA_CORE_TEST_MYSQL_PASSWORD: integration-only
      FNLLA_CORE_TEST_REDIS_HOST: 127.0.0.1
      FNLLA_CORE_TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis, fileinfo, mbstring
          coverage: none
          tools: composer:v2
      - name: Locate Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/ServiceIntegrationTest.php
      - run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: php tests/ApplicationSnapshotServiceTest.php
      - run: python3 scripts/test-upgrade.py

  upload-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Apache and PHP handler
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 libapache2-mod-php
      - name: Verify upload guards over HTTP
        run: python3 scripts/test-upload-http.py resources/project-templates/core/public

  required:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [quality, services, package, upload-http]
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Require every runtime, platform, service and package check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results=json.loads(os.environ["RESULTS"]); assert results and all(job["result"] == "success" for job in results.values()), "Required CI failed, was cancelled or was skipped"'
