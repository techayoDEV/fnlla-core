<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Two runtimes. Clear application ownership.</title>
  <desc id="desc">Core supplies server contracts. The application owns its interface and business rules. Application: Routes, business Actions and policies. Your data and chosen infrastructure. Web runtime: PHP HTTP, DI, validation and storage. Core authorization and transaction contracts. UI runtime: Browser HTML, CSS and JavaScript. Optional navigation; ordinary SSR still works. Human control: Explicit configuration and review. AI is optional in development and runtime. Web runtime and UI runtime are separate layers; neither grants application permissions.</desc>
  <rect width="1600" height="440" fill="#f5f8ff"/>
  <text x="64" y="70" fill="#0c1635" font-family="Arial,sans-serif" font-size="36" font-weight="700">Two runtimes. Clear application ownership.</text>
  <text x="64" y="106" fill="#536d96" font-family="Arial,sans-serif" font-size="20">Core supplies server contracts. The application owns its interface and business rules.</text>
  <g font-family="Arial,sans-serif">
