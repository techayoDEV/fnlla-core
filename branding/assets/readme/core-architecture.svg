<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FNLLA Core architecture</title>
  <desc id="desc">Application-owned product code sits above explicit FNLLA Core web framework primitives.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <rect width="1200" height="10" fill="#2563eb"/>
  <text x="64" y="70" fill="#0b1220" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">Framework primitives. Application freedom.</text>
  <text x="64" y="108" fill="#4b5563" font-family="JetBrains Mono, Consolas, monospace" font-size="18">EXPLICIT CONTRACTS / INSPECTABLE RUNTIME / APPLICATION-OWNED PRODUCT</text>
  <rect x="64" y="148" width="1072" height="102" rx="12" fill="#0b1220"/>
  <text x="96" y="188" fill="#93c5fd" font-family="JetBrains Mono, Consolas, monospace" font-size="17">YOUR APPLICATION</text>
  <text x="96" y="224" fill="#ffffff" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Identity · business rules · product data · user experience</text>
  <path d="M600 268v32" stroke="#2563eb" stroke-width="4"/>
  <path d="M590 291l10 12 10-12" fill="none" stroke="#2563eb" stroke-width="4"/>
  <g font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#0b1220">
    <rect x="64" y="322" width="244" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="88" y="360">HTTP &amp; ROUTING</text><text x="88" y="389" fill="#4b5563" font-size="15" font-weight="400">Requests, middleware, responses</text>
    <rect x="324" y="322" width="244" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="348" y="360">DATA &amp; STATE</text><text x="348" y="389" fill="#4b5563" font-size="15" font-weight="400">Database, sessions, cache</text>
    <rect x="584" y="322" width="244" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="608" y="360">JOBS &amp; EVENTS</text><text x="608" y="389" fill="#4b5563" font-size="15" font-weight="400">Queues, mail, action contracts</text>
    <rect x="844" y="322" width="292" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="868" y="360">CLI &amp; VALIDATION</text><text x="868" y="389" fill="#4b5563" font-size="15" font-weight="400">Project tools and verification</text>
  </g>
  <line x1="64" y1="456" x2="1136" y2="456" stroke="#e5e7eb" stroke-width="2"/>
  <text x="64" y="492" fill="#2563eb" font-family="JetBrains Mono, Consolas, monospace" font-size="18">fnlla.com</text>
  <text x="1136" y="492" text-anchor="end" fill="#374151" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Created &amp; maintained by TechAyo</text>
</svg>
